# Include this server block in your Nginx configuration.
# Copy the CONTENTS of dist/ to /var/www/nse before reloading Nginx.
server {
    listen 80;
    server_name _;
    root /var/www/nse;
    index index.html;

    location /nse-api/ {
        proxy_pass https://nse.lendrixventech.com/api/v1/;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host nse.lendrixventech.com;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 35s;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
